# SunPKCS11 configuration for a local SoftHSM2 token.
# Adjust the library path if SoftHSM2 is installed somewhere else.
name = SoftHSM2
library = C:/SoftHSM2/lib/softhsm2-x64.dll
slotListIndex = 0

attributes(generate, CKO_SECRET_KEY, *) = {
  CKA_TOKEN = true
  CKA_PRIVATE = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}

attributes(import, CKO_SECRET_KEY, *) = {
  CKA_TOKEN = true
  CKA_PRIVATE = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}
